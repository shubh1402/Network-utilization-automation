[project]
name = "network-utilization-automation"
version = "2.0.0"
description = "Daily WAN link utilization reporting from Zabbix, with threshold analytics, Excel reports and a web dashboard."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
